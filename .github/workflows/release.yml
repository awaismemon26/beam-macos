name: Release

# Push a tag like v1.1.0: tests, builds the universal app and creates a *draft* GitHub release with the
# CHANGELOG notes, the zip and its SHA-256. Review the draft and click Publish.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build and draft release
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Unit tests (BeamKit)
        working-directory: Packages/BeamKit
        run: swift test

      # Signs with the stable "Beam" certificate so macOS keeps Accessibility across updates. Without the
      # secrets, forks fall back to ad-hoc signing and say so in the log; Beam's own repository fails instead,
      # because its release notes promise that updates keep Accessibility.
      - name: Import signing certificate
        env:
          P12_BASE64: ${{ secrets.BEAM_SIGNING_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.BEAM_SIGNING_P12_PASSWORD }}
          OFFICIAL_REPO: ${{ github.repository == 'awaismemon26/beam-macos' }}
        run: |
          if [ -z "$P12_BASE64" ] || [ -z "$P12_PASSWORD" ]; then
            if [ "$OFFICIAL_REPO" = "true" ]; then
              echo "::error title=Signing secrets missing::Set BEAM_SIGNING_P12_BASE64 and BEAM_SIGNING_P12_PASSWORD (see Tools/make-signing-cert.sh). An ad-hoc signed release would make every user grant Accessibility again."
              exit 1
            fi
            echo "No signing secrets; the release will be ad-hoc signed."
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/beam-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/beam.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/beam.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/beam.p12"
          echo "BEAM_SIGNING_IDENTITY=Beam" >> "$GITHUB_ENV"
          echo "BEAM_SIGNING_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Build universal app
        run: Tools/build-release.sh "${GITHUB_REF_NAME#v}" "${{ github.run_number }}"

      - name: Release notes
        run: Tools/release-notes.sh "$GITHUB_REF_NAME" > release-notes.md

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: Beam ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            dist/Beam-*.zip
            dist/Beam-*.zip.sha256

      - name: Delete signing keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/beam-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/beam.p12"
