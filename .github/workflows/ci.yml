name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test and build
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Unit tests (BeamKit)
        working-directory: Packages/BeamKit
        run: swift test

      - name: Build universal app
        run: Tools/build-release.sh "0.0.0" "${{ github.run_number }}"

      - name: Window-search rendering check
        run: Tools/RenderCheck/run.sh

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: Beam-ci-${{ github.run_number }}
          path: dist/*.zip
          retention-days: 7
